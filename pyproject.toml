[project]
name = "badmintontwin"
version = "0.1.0"
description = "Badminton player behavior modeling and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dtaidistance>=2.3.12,<3",
    "jinja2>=3.1.4,<4",
    "numpy>=1.26.4,<3",
    "openai>=2,<3",
    "pandas>=2.2.3,<4",
    "pyyaml>=6.0.2,<7",
    "torch>=2.7,<3",
    "torchsde>=0.2.6,<0.3",
    "tqdm>=4.66.5,<5",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9.2,<4",
    "scipy>=1.14.1,<2",
]
llm = [
    "json-repair>=0.30,<1",
    "langfuse>=4,<5",
    "python-dotenv>=1.0.1,<2",
]
twin = [
    "sentence-transformers>=5,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
