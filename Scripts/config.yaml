# BadmintonTwin Experiment Configuration
# 統一實驗配置檔案

# 資料路徑配置
paths:
  # 原始資料
  merged_csv: "Data/intermediate_data/merged.csv"
  player_map: "Data/intermediate_data/player_index_map.json"
  
  # Train/Test Split 檔案
  norm_split: "Data/intermediate_data/train_test_split.json"
  shifted_split: "Data/intermediate_data/style_shift_split.json"
  style_shift_json: "Data/intermediate_data/style_shift.json"
  rally_split: "Data/intermediate_data/rally_split.json"
  rally_profiles: "Data/intermediate_data/rally_profiles.json"
  
  # BC 實驗路徑
  bc:
    data: "Experiments/bc/data/rally"
    weight_dir: "Experiments/bc/weight"
    results_dir: "Experiments/bc/results"
    model: "Experiments/bc/weight/rally_model.pth"
    results: "Experiments/bc/results/rally_eval.json"

  # RallyNet experiment paths
  rallynet:
    data: "Experiments/rallynet/data/rally"
    checkpoint_dir: "Experiments/rallynet/checkpoints/rally"
    model: "Experiments/rallynet/weight/rally_model.pth"
  
  # NaiveRAG 實驗路徑
  naive_rag:
    data: "Experiments/naive_rag/data/rally"
    results_dir: "Experiments/naive_rag/results"
    results:
      norm: "Experiments/naive_rag/results/norm_eval.json"
      shifted: "Experiments/naive_rag/results/shifted_eval.json"

  # Pure LLM 實驗路徑
  pure_llm:
    results_dir: "Experiments/pure_llm/results"

  # Random Agent 實驗路徑
  random:
    results_dir: "Experiments/random/results"
    results:
      norm: "Experiments/random/results/norm_eval.json"
      shifted: "Experiments/random/results/shifted_eval.json"

  # TimeRAG 實驗路徑
  timerag:
    data: "Experiments/timerag/data/rally"
    results_dir: "Experiments/timerag/results"
    results:
      norm: "Experiments/timerag/results/norm_eval.json"
      shifted: "Experiments/timerag/results/shifted_eval.json"

  # Twin (aspect-memory retrieval) 實驗路徑
  twin:
    data: "Experiments/twin/data/rally"
    embeddings: "Experiments/twin/embeddings/rally"
    results_dir: "Experiments/twin/results"

  # ShuttleNet 實驗路徑
  shuttlenet:
    data: "Experiments/shuttlenet/data/rally"
    weight_dir: "Experiments/shuttlenet/weight"
    results_dir: "Experiments/shuttlenet/results"
    model: "Experiments/shuttlenet/weight/rally_model.pth"
    results: "Experiments/shuttlenet/results/rally_eval.json"

# 統一資料建構設定
data_preparation:
  methods:
    - bc
    - rallynet
    - shuttlenet
    - naive_rag
    - timerag
    - twin

# Rally-level controllability benchmark preprocessing
rally_split:
  train_ratio: 0.8
  test_ratio: 0.2
  seed: 42
  length_quantiles: [0.333333, 0.666667]
  keep_physical_rally_atomic: true

profile_eligibility:
  min_train_rallies: 50
  min_matches: 3
  min_target_nonserve_shots: 1

rally_clustering:
  features:
    - attack_shot_ratio
    - defense_shot_ratio
    - side_ratio
    - frontcourt_ratio
    - backcourt_ratio
    - signed_side_bias
    - front_back_switch_ratio
    - left_right_switch_ratio
    - log_rally_length
    - average_movement
    - landing_opponent_distance
  smoothing_alpha: 2.0
  clip_quantiles: [0.01, 0.99]
  k_min: 2
  min_cluster_size: 5
  n_init: 50
  random_state: 42
  elbow_window_radius: 1
  fallback_min_abs_z: 0.5
  fallback_max_tendencies: 5
  instruction_variant_seed: 42

# BC 訓練參數
bc_training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0001
  input_dim: 32
  hidden_dim: 64
  player_id_len: 43
  shot_type_len: 12
  distribution: gmm
  gmm_num: 5

# RallyNet training parameters
rallynet_training:
  seed: 42
  bc_epochs: 100
  bc_batch_size: 32
  bc_learning_rate: 0.0001
  action_hidden_size: 64
  rallynet_num_iters: 10000
  rallynet_batch_size: 64
  rallynet_learning_rate: 0.0005
  latent_size: 32
  context_size: 64
  hidden_size: 64
  state_embedding_dim: 8
  selected_shot_embedding_dim: 8
  gmm_components: 5
  min_sigma: 0.001
  max_sample_sigma: 1.0
  normalization_epsilon: 0.000001
  reconstruction_noise_std: 0.1
  max_sequence_length: 73
  time_horizon: 2.0
  solver_method: euler
  solver_substeps: 2
  lr_gamma: 0.999
  kl_anneal_steps: 1000
  checkpoint_interval: 100
  kl_weight: 1.0
  reconstruction_weight: 0.1
  gradient_clip_norm: 1.0
  num_workers: 0
  pin_memory: false
  error_pos_weight: null

# ShuttleNet 訓練參數
shuttlenet_training:
  epochs: 150
  batch_size: 32
  learning_rate: 0.0001
  encode_length: 8
  max_ball_round: 35
  shot_dim: 32
  area_dim: 32
  player_dim: 32
  encode_dim: 32
  area_num: 5
  dropout: 0.1

# NaiveRAG 參數
naive_rag:
  skip_first_n: 0

# RallyNet runtime parameters
rallynet:
  seed: 42
  sample: true
  error_threshold: 0.5

# Pure LLM 參數
pure_llm:
  skip_first_n: 0

# TimeRAG 參數
timerag:
  window_size: 5
  skip_first_n: 0

# Twin (aspect-memory retrieval) 參數
twin:
  lambda_weight: 0.5
  embedding_batch_size: 128
  embedding_dtype: "float32"  # float32 | float16
  normalize_embeddings: true
  use_llm: true
  workers: 32
  max_rallies_per_player: null

# Embedding 連線與模型設定，獨立於 LLM provider
embedding:
  active_provider: "${BADMINTON_EMBEDDING_PROVIDER:-local}"
  providers:
    local:
      model: "${LOCAL_EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}"
      revision: null  # 可填 Hugging Face commit hash 以固定 embedding 權重
      device: "${LOCAL_EMBEDDING_DEVICE:-auto}"
      dimension: "${LOCAL_EMBEDDING_DIMENSION:-1024}"
    openrouter:
      model: "${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      dimension: "${OPENROUTER_EMBEDDING_DIMENSION:-1536}"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      default_headers:
        HTTP-Referer: "${OPENROUTER_HTTP_REFERER:-https://github.com}"
        X-Title: "${OPENROUTER_APP_TITLE:-BadmintonTwin}"


# 共用檢索參數
retrieval:
  architecture: two_stage_v1
  stage1:
    normal_top_k: 10
    miss_top_k: 5
  stage2:
    conditioned_top_k: 10

# 評估參數
evaluation:
  device: "cuda"  # 或 "cpu"
  skip_first_n: 0
  workers: 1
  start_method: "spawn"
  instruction_mode: "no_instruct"  # no_instruct | instruct
  instruction_variant: "original"  # original | opposite | random_other | rewrite
  rollout_extra_steps: 2
  save_decision_trace: true

# LLM 共用連線與模型設定
# 私有 endpoint/API key 請使用環境變數覆蓋，不要直接寫入 config。
llm:
  # 可用 BADMINTON_LLM_TYPE=qwen/mistral/gemma 與
  # BADMINTON_LLM_PROVIDER=local/openrouter 一鍵切換。
  active_type: "${BADMINTON_LLM_TYPE:-qwen}"
  active_provider: "${BADMINTON_LLM_PROVIDER:-local}"
  providers:
    local:
      api_key: "${BADMINTON_LLM_API_KEY:-EMPTY}"
      host: "${BADMINTON_LLM_HOST:-localhost}"
      port: "${BADMINTON_LLM_PORT:-16000}"
      base_url: "${BADMINTON_LLM_BASE_URL:-}"
      host_url: "${BADMINTON_LLM_HOST_URL:-}"
      models:
        qwen: "Qwen/Qwen3.5-4B"
        mistral: "mistralai/Ministral-3-14B-Instruct-2512"
        gemma: "google/gemma-4-12B-it"
    openrouter:
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      default_headers:
        HTTP-Referer: "${OPENROUTER_HTTP_REFERER:-https://github.com}"
        X-Title: "${OPENROUTER_APP_TITLE:-BadmintonTwin}"
      models:
        qwen: "${OPENROUTER_QWEN_MODEL:-qwen/qwen3.5-9b}"
        mistral: "${OPENROUTER_MISTRAL_MODEL:-mistralai/ministral-3-14b}"
        gemma: "${OPENROUTER_GEMMA_MODEL:-google/gemma-3-12b-it}"

# LLM generation 參數
llm_generation:
  provider_overrides:
      openrouter:
        extra_body:
          reasoning:
            effort: "none"
          provider:
            require_parameters: true
  deterministic:
    active: false
    params:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 4096
      extra_body:
        top_k: 1
  by_type:
    mistral:
      temperature: 0.15
      max_tokens: 4096
    qwen:
      temperature: 0.7
      top_p: 0.8
      max_tokens: 4096
      extra_body:
        repetition_penalty: 1.0
        top_k: 20
    gemma:
      temperature: 1.0
      top_p: 0.95
      max_tokens: 4096
      extra_body:
        top_k: 64
