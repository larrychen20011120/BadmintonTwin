# BadmintonTwin Experiment Configuration
# 統一實驗配置檔案

# 資料路徑配置
paths:
  # 原始資料
  merged_csv: "Data/intermediate_data/merged.csv"
  player_map: "Data/intermediate_data/player_index_map.json"
  
  # Train/Test Split 檔案
  norm_split: "Data/intermediate_data/train_test_split.json"
  shifted_split: "Data/intermediate_data/style_shift_split.json"
  style_shift_json: "Data/intermediate_data/style_shift.json"
  
  # BC 實驗路徑
  bc:
    data:
      norm: "Experiments/bc/data/norm"
      shifted: "Experiments/bc/data/shifted"
    weight_dir: "Experiments/bc/weight"
    results_dir: "Experiments/bc/results"
    models:
      norm: "Experiments/bc/weight/norm_model.pth"
      shifted: "Experiments/bc/weight/shifted_model.pth"
    results:
      norm: "Experiments/bc/results/norm_eval.json"
      shifted: "Experiments/bc/results/shifted_eval.json"
  
  # NaiveRAG 實驗路徑
  naive_rag:
    data:
      norm: "Experiments/naive_rag/data/norm"
      shifted: "Experiments/naive_rag/data/shifted"
    results_dir: "Experiments/naive_rag/results"
    results:
      norm: "Experiments/naive_rag/results/norm_eval.json"
      shifted: "Experiments/naive_rag/results/shifted_eval.json"

  # Random Agent 實驗路徑
  random:
    results_dir: "Experiments/random/results"
    results:
      norm: "Experiments/random/results/norm_eval.json"
      shifted: "Experiments/random/results/shifted_eval.json"

  # TimeRAG 實驗路徑
  timerag:
    data:
      norm: "Experiments/timerag/data/norm"
      shifted: "Experiments/timerag/data/shifted"
    results_dir: "Experiments/timerag/results"
    results:
      norm: "Experiments/timerag/results/norm_eval.json"
      shifted: "Experiments/timerag/results/shifted_eval.json"

  # Twin (I-MSDP) 實驗路徑
  twin:
    data:
      norm: "Experiments/twin/data/norm"
      shifted: "Experiments/twin/data/shifted"
    results_dir: "Experiments/twin/results"
    results:
      norm: "Experiments/twin/results/norm_eval.json"
      shifted: "Experiments/twin/results/shifted_eval.json"

# BC 訓練參數
bc_training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  input_dim: 32
  hidden_dim: 128
  player_id_len: 43
  shot_type_len: 12

# NaiveRAG 參數
naive_rag:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  api_key: "EMPTY"
  port: 16000
  top_k: 5
  skip_first_n: 0

# TimeRAG 參數
timerag:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  api_key: "EMPTY"
  port: 16000
  window_size: 3
  top_k: 5
  skip_first_n: 0

# Twin (I-MSDP) 參數
twin:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  api_key: "EMPTY"
  port: 16000
  max_scale: 10
  top_k: 5
  skip_first_n: 0

# 評估參數
evaluation:
  device: "cuda"  # 或 "cpu"
  skip_first_n: 0
